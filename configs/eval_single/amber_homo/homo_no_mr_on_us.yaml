wandb:
  project: "report_generation_validation_dinov2_backbone_standard_decoder"

model:
  class_name: "amber"
  runs: ["out/tysxu4d6/ckpt.pt", "out/o0yo0nyb/ckpt.pt", "out/89epnbza/ckpt.pt"]
  name: "CLTLE 6 - Amber HOMO No MR"
  norm_mean: [ 0.485, 0.456, 0.406 ]
  norm_std: [ 0.229, 0.224, 0.225 ]

test_data:
  imgs_shape: [ 512, 512 ]
  img_resize: 560
  imgs_path: "../data/report_generation_split/us-rg-test.bin"
  csv_path: "../data/report_generation_split/us-rg-test.csv"
  grayscale_channel: False

trainer:
  batch_size: 2048
  bootstrap_iters: 2000
  accelerator: "gpu"
  precision: "bfloat16"
