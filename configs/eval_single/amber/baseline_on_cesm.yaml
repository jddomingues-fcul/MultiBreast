wandb:
  project: "report_generation_validation_dinov2_backbone_standard_decoder"

model:
  class_name: "amber"
  runs: ["out/9cp2qqjk/ckpt.pt", "out/7pnf4h76/ckpt.pt", "out/rbc5bev7/ckpt.pt"]
  name: "Amber baseline with RADDINO"
  norm_mean: [ 0.485, 0.456, 0.406 ]
  norm_std: [ 0.229, 0.224, 0.225 ]

test_data:
  imgs_shape: [ 512, 512 ]
  img_resize: 560
  imgs_path: "../data/report_generation_split/cesm-rg-test.bin"
  csv_path: "../data/report_generation_split/cesm-rg-test.csv"
  grayscale_channel: False

trainer:
  batch_size: 2048
  bootstrap_iters: 2000
  accelerator: "gpu"
  precision: "bfloat16"
