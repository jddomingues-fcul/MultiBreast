wandb:
  project: "report_generation_validation_dinov2_backbone_standard_decoder"

model:
  class_name: "amber_no_modality_text"
  run: "out/9fslzrg1/ckpt.pt"
  name: "CLTLE 2 - Amber with no modality text"
  norm_mean: [ 0.485, 0.456, 0.406 ]
  norm_std: [ 0.229, 0.224, 0.225 ]

test_data:
  imgs_shape: [ 512, 512 ]
  img_resize: 560
  imgs_path: "../data/report_generation_split/all-rg-test.bin"
  csv_path: "../data/report_generation_split/all-rg-test.csv"
  grayscale_channel: False

trainer:
  batch_size: 1024
  accelerator: "gpu"
  precision: "bfloat16"
