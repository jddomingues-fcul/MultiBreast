[project]
name = "multibreast"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "absl-py>=2.5.0",
    "bert-score>=0.3.13",
    "evaluate>=0.4.6",
    "gdcm>=1.1",
    "matplotlib>=3.11.0",
    "nltk>=3.9.4",
    "numpy>=2.5.1",
    "omegaconf>=2.3.1",
    "opencv-python>=5.0.0.93",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pillow>=12.3.0",
    "pre-commit>=4.6.0",
    "pydicom>=3.0.2",
    "pylibjpeg>=2.1.0",
    "pylibjpeg-libjpeg>=2.4.0",
    "pypandoc>=1.17",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "setuptools>=81.0.0",
    "simpleitk>=2.5.5",
    "tokenizers>=0.23.1",
    "torch>=2.12.1",
    "torchinfo>=1.8.0",
    "torchmetrics>=1.9.0",
    "torchtext>=0.18.0",
    "torchvision>=0.27.1",
    "tqdm>=4.68.3",
    "transformers>=4.17.0",
    "wandb>=0.28.0",
    "weightwatcher>=0.7.7",
    "xlrd>=2.0.2",
]

[tool.black]
line-length = 150
include = '\.pyi?$'
exclude = '''
    /(
        \.git
      | \.hg
      | \.mypy_cache
      | \.tox
      | \.venv
      | _build
      | buck-out
      | build
      | dist

      # Specific to Black
      | blib2to3
      | tests/data
    )/
    '''
